<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schoen Poll - Results</title>

    <!-- Include all four of these on your webpage.
         It's ok to hotlink the js and css files to where they are hosted.
         KaTeX typesets the LaTeX in the question and in the answer options. -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
    <script type="module" src="schoen-poll.js"></script>
    <link rel="stylesheet" type="text/css" href="schoen-poll.css">

    <!-- These are just for the favicon, can be omitted. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/schoen-poll/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/schoen-poll/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/schoen-poll/favicon-16x16.png">
    <link rel="manifest" href="/schoen-poll/site.webmanifest">

</head>
<body>

    <!-- Then also include these lines anywhere on your webpage.
         Nothing shows until a question is running. The answer options then stay
         up for the whole question, while the Admin remote separately toggles the
         question text, the vote bubbles (reveal/hide) and the QR code. -->
    <div id="schoenPollLoginSection">
        <button id="spLoginBtn">Schoen Poll Login</button>
        <div id="spAuthMessage"></div>
    </div>
    <div id="schoenPollQuestion" class="hidden"></div>
    <div id="schoenPollOverlay">
        <svg id="spChart"></svg>
        <div id="spLabels"></div>
    </div>
    <div id="schoenPollQRContainer" class="hidden">
        <img id="spQRimage" src="" alt="Scan to join">
        <p>Scan to join the poll! Or go to:</p>
        <code id="spQRurl"></code>
    </div>

</body>
</html>
